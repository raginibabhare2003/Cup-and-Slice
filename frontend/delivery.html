<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cup & Slice - Delivery Console</title><style>body{font-family:Arial;background:#f5f7fa;margin:0}.bar{background:#111;color:#fff;padding:18px}.wrap{max-width:900px;margin:20px auto;padding:10px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 18px #0001;margin:12px 0}.btn{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}.primary{background:#111;color:#fff}input{padding:11px;width:100%;box-sizing:border-box;margin:5px 0}</style></head><body><div class="bar"><b>🛵 Cup & Slice Delivery Console</b></div><main class="wrap"><div id="login" class="card"><h2>Delivery Staff Login</h2><input id="u" placeholder="Staff ID"><input id="p" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Sign in</button></div><div id="app" style="display:none"><h1>Active Deliveries</h1><p id="gps">GPS not started.</p><div id="orders"></div></div></main><script>let token=localStorage.getItem('deliveryToken')||'';const api=(p,o={})=>fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:o.body?JSON.stringify(o.body):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j});async function login(){try{const r=await api('/auth/login',{method:'POST',body:{username:u.value,password:p.value}});if(!['delivery','admin'].includes(r.role))throw Error('Delivery access required');token=r.token;localStorage.setItem('deliveryToken',token);show();load()}catch(e){alert(e.message)}}function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}async function load(){try{const rows=await api('/delivery/orders');document.getElementById('orders').innerHTML=rows.map(o=>`<div class="card"><h2>#${o.id} ${o.item} × ${o.qty}</h2><p>Customer: ${o.username||'-'} | Phone: ${o.phone||'-'}</p><p>Address: ${o.address||'-'}</p><p>ETA: ${o.eta_minutes||0} min</p><p>GPS sharing starts while this order is out for delivery.</p><button class="btn primary" onclick="start(${o.id})">📍 Start/Update GPS</button></div>`).join('')||'<p>No active deliveries.</p>'}catch(e){console.error(e)}}async function start(orderId){if(!navigator.geolocation)return alert('GPS is not supported by this browser.');navigator.geolocation.watchPosition(async pos=>{try{await api('/delivery/location',{method:'POST',body:{orderId,lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy}});document.getElementById('gps').textContent=`📍 Last GPS update: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`}catch(e){document.getElementById('gps').textContent=e.message}},e=>alert('Please allow location permission: '+e.message),{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}if(token){show();load()}setInterval(()=>{if(token)load()},5000)</script></body></html>
