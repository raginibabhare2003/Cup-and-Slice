<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Cup & Slice — Owner Setup</title><link rel="manifest" href="/manifest.json"><style>body{font-family:Arial,sans-serif;background:#fff8f0;margin:0;color:#171717}.wrap{max-width:560px;margin:8vh auto;padding:20px}.card{background:white;border-radius:22px;padding:30px;box-shadow:0 12px 40px #0001}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:13px 18px;background:#111;color:#fff;cursor:pointer;margin-top:10px}.muted{color:#666}.ok{color:#16833b}.err{color:#b42318}</style></head><body><main class="wrap"><div class="card"><h1>☕ Cup & Slice</h1><h2>Owner / Admin Setup</h2><p class="muted">First-time setup only. No admin password is stored in the source code.</p><div id="state">Checking setup…</div><form id="form" style="display:none"><input id="username" placeholder="Owner User ID" required minlength="3"><input id="password" type="password" placeholder="Password (minimum 8 characters)" required minlength="8"><input id="email" type="email" placeholder="Business email"><input id="phone" placeholder="Business mobile"><button class="btn" type="submit">Create Owner Account</button></form><p id="msg"></p><p><a href="/admin.html">Go to Admin Panel</a> · <a href="/">Website</a></p></div></main><script>const $=id=>document.getElementById(id);async function check(){try{const r=await fetch('/api/setup/status');const j=await r.json();if(j.setupRequired){$('state').textContent='Create your restaurant owner account below.';$('form').style.display='block'}else $('state').innerHTML='<span class="ok">Owner account already exists.</span>'}catch(e){$('state').textContent='Backend is not reachable. Start the server first.';$('state').className='err'}}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Creating…';try{const r=await fetch('/api/setup/create-owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value,email:$('email').value,phone:$('phone').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Setup failed');$('msg').innerHTML='<span class="ok">'+j.message+'</span>';setTimeout(()=>location='/admin.html',700)}catch(e){$('msg').innerHTML='<span class="err">'+e.message+'</span>'}};check();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
