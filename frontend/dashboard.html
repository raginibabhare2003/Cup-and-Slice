<!doctype html><html><head><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#111"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cup & Slice - Customer Dashboard</title><link rel="stylesheet" href="style1.css"><style>
body{background:#fff8fb}.dash{max-width:1200px;margin:90px auto 40px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:20px 0}.stat,.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001}.stat b{font-size:28px}.order{border-left:6px solid #ff4f9a;margin:15px 0}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#f3e8ff;font-size:13px}.notice{background:#fff4cc;padding:14px;border-radius:12px;margin:8px 0}.btn{border:0;border-radius:10px;padding:9px 13px;cursor:pointer}.danger{background:#ffe0e0}.success{background:#e1ffe8}.stars button{font-size:24px;border:0;background:none;cursor:pointer}.hidden{display:none}input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0}.nav{position:fixed;top:0;left:0;right:0;background:#111;color:#fff;padding:14px 25px;z-index:5}.nav a{color:#fff;margin-right:20px;text-decoration:none}
</style></head><body><div class="nav"><b>☕ Cup & Slice</b> <a href="/">HOME</a> <a href="javascript:void(0)" onclick="logout()">SIGN OUT</a></div><main class="dash"><div class="top"><div><h1>Customer Dashboard 👋</h1><p id="profileLine"></p></div><button class="btn" onclick="loadAll()">🔄 Refresh</button></div><div class="grid"><div class="stat">Orders<br><b id="count">0</b></div><div class="stat">Pending<br><b id="pending">0</b></div><div class="stat">Delivered<br><b id="delivered">0</b></div><div class="stat">Unread alerts<br><b id="unread">0</b></div></div><section class="card" id="liveTracking"><h2>📍 Live Order Tracking</h2><div id="trackingList">No active delivery right now.</div></section><section class="card"><h2>🔔 Notifications</h2><button class="btn success" onclick="readAll()">Mark all read</button><div id="notices"></div></section><section class="card"><h2>🛍️ My Orders</h2><div id="orders"></div></section><section class="card"><h2>👤 Profile & Contact</h2><input id="email" placeholder="Email"><input id="phone" placeholder="Mobile number"><button class="btn" onclick="saveProfile()">Save Contact</button><p id="profileMsg"></p></section></main><div id="pushPrompt" style="display:none;position:fixed;right:18px;bottom:18px;z-index:99999;max-width:340px;background:#fff;padding:18px;border-radius:16px;box-shadow:0 10px 40px #0003;border:1px solid #ddd"><b>🔔 Turn on notifications?</b><p style="margin:8px 0;font-size:14px">Get order updates and Cup & Slice announcements on this device.</p><button onclick="enablePush()" style="padding:9px 13px;border:0;border-radius:8px;background:#111;color:#fff">Allow notifications</button> <button onclick="document.getElementById('pushPrompt').style.display='none'" style="padding:9px 13px;border:0;border-radius:8px">Not now</button></div>
<script>
const API='/api';let token=localStorage.getItem('token');if(!token)location='/';const api=(p,o={})=>fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:o.body?JSON.stringify(o.body):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadAll(){try{const [me,orders,notes]=await Promise.all([api('/auth/me'),api('/orders'),api('/notifications')]);document.getElementById('profileLine').textContent=`Signed in as ${me.username} | ${me.email||'No email'} | ${me.phone||'No mobile'}`;email.value=me.email||'';phone.value=me.phone||'';count.textContent=orders.length;pending.textContent=orders.filter(o=>['pending','confirmed','preparing','ready','out_for_delivery'].includes(o.status)).length;delivered.textContent=orders.filter(o=>o.status==='delivered').length;unread.textContent=notes.filter(n=>!n.is_read).length;document.getElementById('notices').innerHTML=notes.length?notes.map(n=>`<div class="notice"><b>${esc(n.title)}</b><br>${esc(n.message)}<br><small>${esc(n.created)}</small></div>`).join(''):'No notifications';document.getElementById('orders').innerHTML=orders.length?orders.map(o=>{const canCancel=['pending','confirmed'].includes(o.status);const review=o.status==='delivered'&&!o.rating;return `<div class="card order"><h3>#${o.id} ${esc(o.item)} × ${o.qty}</h3><p><b>Status:</b> <span class="pill">${esc(o.status.replaceAll('_',' '))}</span> &nbsp; <b>ETA:</b> <span id="eta-${o.id}">${o.eta_until?remaining(o.eta_until):((o.eta_minutes||0)+' min')}</span></p><p>₹${Number(o.total).toFixed(2)} | ${esc(o.order_type)} | ${esc(o.payment_method)} | Payment: ${esc(o.payment_status)}</p><p>📍 ${esc(o.address||'')} ${o.table_no?`| Table ${esc(o.table_no)}`:''}</p><p>🛒 Source: ${esc(o.order_source)} | ${esc(o.created)}</p>${canCancel?`<button class="btn danger" onclick="cancelOrder(${o.id})">Cancel Order</button>`:''}${review?`<div class="card"><b>Rate your order</b><div class="stars" id="stars-${o.id}">${[1,2,3,4,5].map(n=>`<button onclick="setRating(${o.id},${n})">☆</button>`).join('')}</div><textarea id="comment-${o.id}" placeholder="Write feedback"></textarea><button class="btn success" onclick="feedback(${o.id})">Submit Feedback</button></div>`:''}${o.rating?`<p>⭐ Your rating: ${o.rating}/5 — ${esc(o.comment||'')}</p>`:''}</div>`}).join(''):'No orders yet. Go to the menu and place your first order.'}catch(e){alert(e.message)}}
let ratings={};function setRating(id,n){ratings[id]=n;document.querySelectorAll('#stars-'+id+' button').forEach((b,i)=>b.textContent=i<n?'★':'☆')}async function feedback(id){try{if(!ratings[id])return alert('Please select a rating');await api('/feedback',{method:'POST',body:{orderId:id,rating:ratings[id],comment:document.getElementById('comment-'+id).value}});alert('Thank you for your feedback ⭐');loadAll()}catch(e){alert(e.message)}}async function cancelOrder(id){if(!confirm('Cancel this order?'))return;try{await api('/orders/cancel',{method:'PUT',body:{orderId:id,reason:'Cancelled by customer'}});loadAll()}catch(e){alert(e.message)}}async function readAll(){await api('/notifications/read',{method:'PUT',body:{all:true}});loadAll()}async function saveProfile(){try{await api('/auth/profile',{method:'PUT',body:{email:email.value,phone:phone.value}});profileMsg.textContent='Saved ✅';loadAll()}catch(e){profileMsg.textContent=e.message}}function remaining(until){const ms=new Date(until)-Date.now();if(ms<=0)return 'Ready / due now';const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);return `${m}m ${String(s).padStart(2,'0')}s remaining`}
async function loadTracking(){try{const rows=await api('/orders/tracking');document.getElementById('trackingList').innerHTML=rows.length?rows.map(o=>{const has=o.delivery_lat&&o.delivery_lng;return `<div class="card"><b>#${o.id} ${esc(o.item)}</b><p>Status: <span class="pill">${esc(o.status.replaceAll('_',' '))}</span> | ETA: <b>${o.eta_until?remaining(o.eta_until):((o.eta_minutes||0)+' min')}</b></p>${o.status==='out_for_delivery'?`<p>📍 Delivery location: ${has?`${Number(o.delivery_lat).toFixed(5)}, ${Number(o.delivery_lng).toFixed(5)}`:'Waiting for delivery GPS update'}</p>${has?`<a target="_blank" href="https://www.openstreetmap.org/?mlat=${o.delivery_lat}&mlon=${o.delivery_lng}#map=17/${o.delivery_lat}/${o.delivery_lng}">Open live location map</a>`:''}`:''}</div>`}).join(''):'No active delivery right now.'}catch(e){}}
function logout(){localStorage.clear();location='/'}loadAll();loadTracking();setupPush();setInterval(()=>{loadAll();loadTracking()},5000);setInterval(()=>document.querySelectorAll('[id^=eta-]').forEach(x=>{const o=x.id.split('-')[1];const card=x.closest('.order');}),1000);

async function enablePush(){try{if(!('Notification'in window)||!('serviceWorker'in navigator))return alert('Browser notifications are not supported here.');const permission=await Notification.requestPermission();document.getElementById('pushPrompt').style.display='none';if(permission!=='granted')return;const reg=await navigator.serviceWorker.ready;const cfg=await api('/push/public-key');if(!cfg.enabled)return;const key=Uint8Array.from(atob(cfg.publicKey.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});await api('/push/subscribe',{method:'POST',body:sub.toJSON()});new Notification('Cup & Slice 🔔',{body:'Notifications are now enabled.'});}catch(e){console.error(e);}}
async function setupPush(){try{if(!('Notification'in window))return;if(Notification.permission==='granted'){await enablePush();}else if(Notification.permission==='default'){setTimeout(()=>document.getElementById('pushPrompt').style.display='block',1200)}}catch(e){}}
</script><button id="installApp" style="position:fixed;right:16px;bottom:16px;z-index:9999;padding:11px 15px;border:0;border-radius:999px;background:#111;color:#fff;display:none;box-shadow:0 6px 20px #0003">📲 Download App</button><script>(function(){let d,p;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();d=e;const b=document.getElementById("installApp");if(b){b.style.display="block";b.onclick=async()=>{d.prompt();await d.userChoice;b.style.display="none"}}});if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");})();</script></body></html>
