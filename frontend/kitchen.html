<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cup & Slice - Kitchen Display</title><style>body{font-family:Arial;background:#f7f7f7;margin:0}.bar{background:#111;color:#fff;padding:18px}.wrap{max-width:1200px;margin:20px auto;padding:10px}.login,.order{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 18px #0001;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.btn{padding:10px;border:0;border-radius:9px;margin:4px;cursor:pointer}.primary{background:#111;color:#fff}input{padding:11px;width:100%;box-sizing:border-box;margin:5px 0}</style></head><body><div class="bar"><b>🍳 Cup & Slice Kitchen Display</b></div><main class="wrap"><div id="login" class="login"><h2>Kitchen Staff Login</h2><input id="u" placeholder="Staff ID"><input id="p" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Sign in</button></div><div id="app" style="display:none"><h1>Live Kitchen Orders</h1><div id="orders" class="grid"></div></div></main><script>const api=(p,o={})=>fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.getItem('staffToken')||'')},body:o.body?JSON.stringify(o.body):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j});async function login(){try{const r=await api('/auth/login',{method:'POST',body:{username:u.value,password:p.value}});if(!['kitchen','admin'].includes(r.role))throw Error('Kitchen access required');localStorage.setItem('staffToken',r.token);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/admin/orders');document.getElementById('orders').innerHTML=rows.filter(o=>['pending','confirmed','preparing','ready'].includes(o.status)).map(o=>`<div class="order"><h2>#${o.id}</h2><h3>${o.item} × ${o.qty}</h3><p>Customer: ${o.customer_name||o.username}</p><p>Notes: ${o.notes||'None'}</p><p>ETA: ${o.eta_minutes||0} min</p><button class="btn" onclick="set(${o.id},'preparing')">👨‍🍳 Preparing</button><button class="btn" onclick="set(${o.id},'ready')">🍕 Ready</button></div>`).join('')||'<p>No active kitchen orders.</p>'}catch(e){console.error(e)}}async function set(id,status){let eta=status==='preparing'?prompt('Preparation time (minutes):','15'):'10';if(eta===null)return;try{await api('/admin/orders/status',{method:'PUT',body:{orderId:id,status,etaMinutes:Number(eta)}});load()}catch(e){alert(e.message)}}if(localStorage.getItem('staffToken')){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}setInterval(()=>{if(localStorage.getItem('staffToken'))load()},5000)</script></body></html>
